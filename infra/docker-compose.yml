version: "3.9"

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homeops
      POSTGRES_PASSWORD: homeops
      POSTGRES_DB: homeops_grocery
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeops -d homeops_grocery"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://homeops:homeops@db:5432/homeops_grocery
      DATA_DIR: /app/data
    volumes:
      - image_data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
    driver: local
  image_data:
    driver: local
